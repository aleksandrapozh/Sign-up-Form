<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet" type="text/css">
    <link rel="preload" href="fonts/Norse-Bold.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
     <div class="container">

    <div class="sidebar">
      <div class="logo-container">
       <img src="odin-lined.png" alt="Odin" class="logo-img">
       <span class="logo-text">ODIN</span>
      </div>
      <div class="footer-credit">
        Photo by <a href="https://unsplash.com/@haliewestphoto" target="_blank" rel="noopener noreferrer">Halie West</a> on <a href="https://unsplash.com" target="_blank" rel="noopener noreferrer">Unsplash</a>
      </div>
    </div>

    
    <div class="main-content">  
      <div class="intro-text">
        <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
        <p>You <em>know</em> you want to.</p>
      </div>

      <div class="form-container">
        <h2>Let's do this!</h2>
        <form action="#" method="post">
          
        <div class="form-row">
        <div class="form-group">
            <label for="first_name">FIRST NAME</label>
            <input type="text" id="first_name" name="first_name" placeholder="Thor" required>
        </div>
        
        <div class="form-group">
            <label for="last_name">LAST NAME</label>
            <input type="text" id="last_name" name="last_name" placeholder="Odinson" required>
        </div>
        </div>

        <div class="form-row">
        <div class="form-group">
            <label for="email">EMAIL</label>
            <input type="email" id="email" name="user_email" required>
        </div>
        
        <div class="form-group">
            <label for="phone_number">PHONE NUMBER</label>
            <input type="tel" id="phone_number" name="user_phone">
        </div>
        </div>

        <div class="form-row">
        <div class="form-group">
            <label for="user_password">PASSWORD</label>
            <input type="password" id="user_password" name="user_password" required>
        </div>
        
        <div class="form-group">
            <label for="confirm_password">CONFIRM PASSWORD</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        </div>

        </form>
      </div>

      <div class="action-container">
        <button type="submit" id="submit">Create Account</button>
        <p>Already have an account? <a href="#">Log in</a></p>
      </div> 

    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
