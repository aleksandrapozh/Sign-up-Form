<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet" type="text/css">
    <link rel="preload" href="fonts/Norse-Bold.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
     <div class="container">

    <div class="sidebar">
      <div class="logo-container">
       <img src="odin-lined.png" alt="Odin" class="logo-img">
       <span class="logo-text">ODIN</span>
      </div>
      <div class="footer-credit">
        Photo by <a href="https://unsplash.com/@haliewestphoto" target="_blank" rel="noopener noreferrer">Halie West</a> on <a href="https://unsplash.com" target="_blank" rel="noopener noreferrer">Unsplash</a>
      </div>
    </div>

    <!-- Правая секция (Приветственный текст + Форма + Кнопка) -->
    <div class="main-content">
      
      <!-- Верхний текстовый блок -->
      <div class="intro-text">
        <!-- Сюда заголовок и описательный текст -->
      </div>

      <!-- Секция с формой -->
      <div class="form-container">
        <h2>Let's do this!</h2>
        <form action="#" method="post">
          
          <div class="form-row">
            <!-- Сюда поля: First Name и Last Name -->
          </div>

          <div class="form-row">
            <!-- Сюда поля: Email и Phone Number -->
          </div>

          <div class="form-row">
            <!-- Сюда поля: Password и Confirm Password -->
          </div>

        </form>
      </div>

      <!-- Нижний блок с кнопкой отправки и входом -->
      <div class="action-container">
        <button type="submit">Create Account</button>
        <p>Already have an account? <a href="#">Log in</a></p>
      </div>

    </div>

  </div>
    
</body>
</html>
